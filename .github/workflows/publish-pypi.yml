name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified 0.1.0 distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Quigleybits/agent-coop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the source CI run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, subprocess
          run = json.loads(subprocess.check_output([
              "gh", "api", "repos/Quigleybits/agent-coop/actions/runs/34141910286"
          ]))
          assert run["head_sha"] == "48b4ca15c7fe3e2e9759009f88b8145576ce4a50"
          assert run["event"] == "push" and run["conclusion"] == "success"

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-coop-windows-latest
          run-id: 34141910286
          github-token: ${{ github.token }}
          path: dist

      - name: Verify exact files and hashes
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              "agent_coop_cli-0.1.0-py3-none-any.whl": "4ff255cc7e88e18aea1a329809f25f7c2fc7f55e1b8ef14706afcbc92cdfb328",
              "agent_coop_cli-0.1.0.tar.gz": "9526f656926120054f0e37ecd3c7b93157722ef2ba9f13e2044ed7d32702eee1",
          }
          files = list(Path("dist").iterdir())
          assert {p.name for p in files} == set(expected)
          for path in files:
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name]
          print("Verified the exact 0.1.0 wheel and source distribution")

  publish:
    needs: verify
    if: inputs.publish && github.repository == 'Quigleybits/agent-coop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agent-coop-cli/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-coop-windows-latest
          run-id: 34141910286
          github-token: ${{ github.token }}
          path: dist

      - name: Verify exact files and hashes before upload
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              "agent_coop_cli-0.1.0-py3-none-any.whl": "4ff255cc7e88e18aea1a329809f25f7c2fc7f55e1b8ef14706afcbc92cdfb328",
              "agent_coop_cli-0.1.0.tar.gz": "9526f656926120054f0e37ecd3c7b93157722ef2ba9f13e2044ed7d32702eee1",
          }
          files = list(Path("dist").iterdir())
          assert {p.name for p in files} == set(expected)
          for path in files:
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name]

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          attestations: true
          skip-existing: false
          verbose: false
          print-hash: true
