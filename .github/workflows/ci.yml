name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COOP_SESSION_ID: ""
  COOP_AGENT: ""
  COOP_AGENT_ID: ""
  COOP_DB: ""
  COOP_DB_PATH: ""
  COOP_DEFAULT_DB: ""
  COOP_ITEM_ID: ""
  COOP_PROVIDER: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the test runner
        run: python -m pip install pytest==9.0.2

      - name: Assert no Co-op session is bound
        shell: python
        run: |
          import os
          import sys

          bound = sorted(
              key for key, value in os.environ.items()
              if key.startswith("COOP_") and value
          )
          print("bound COOP_* variables:", bound or "none")
          raise SystemExit(1 if bound else 0)

      - name: Run the full suite
        run: python -m pytest -q

      - name: Run the offline process-tree smoke
        run: python -m agent_coop smoke --offline

  distributions:
    name: distributions (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the pinned build frontend
        run: python -m pip install build==1.3.0

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Install the pinned metadata checker
        run: python -m pip install twine==7.0.0

      - name: Check the distribution metadata renders
        shell: bash
        run: python -m twine check --strict dist/*

      - name: Inspect artifacts and run the installed console script
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tarfile
          import venv
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("agent_coop-*.whl"))
          sdists = sorted(dist.glob("agent_coop-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one wheel and one sdist; got {wheels!r}, {sdists!r}"
              )

          required = {
              "agent_coop/schema.sql",
              "agent_coop/adapters/claude/SKILL.md",
              "agent_coop/adapters/agents/SKILL.md",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
          missing = sorted(required - wheel_names)
          if missing:
              raise SystemExit(f"wheel missing runtime data: {missing}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = {
                  "/".join(pathlib.PurePosixPath(name).parts[1:])
                  for name in archive.getnames()
              }
          missing = sorted(
              (required | {
                  "CHANGELOG.md", "COOP_GUIDE.md", "LICENSE", "MANIFEST.in",
                  "README.md", "SECURITY.md", "SKILL.md", "docs/manual.md",
                  "pyproject.toml",
              }) - sdist_names
          )
          if missing:
              raise SystemExit(f"sdist missing release data: {missing}")
          if any(name == "tests" or name.startswith("tests/") for name in sdist_names):
              raise SystemExit("sdist must not include developer tests")

          environment = pathlib.Path(os.environ["RUNNER_TEMP"]) / "coop-wheel"
          venv.EnvBuilder(with_pip=True, clear=True).create(environment)
          python = environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          coop = environment / (
              "Scripts/coop.exe" if os.name == "nt" else "bin/coop"
          )
          agent_coop = environment / (
              "Scripts/agent-coop.exe" if os.name == "nt" else "bin/agent-coop"
          )
          subprocess.run(
              [str(python), "-m", "pip", "install", "--no-index", "--no-deps",
               str(wheels[0].resolve())],
              check=True,
          )
          clean_cwd = pathlib.Path(os.environ["RUNNER_TEMP"]) / "coop-smoke-cwd"
          clean_cwd.mkdir(exist_ok=True)
          subprocess.run(
              [str(coop), "smoke", "--offline"],
              cwd=clean_cwd,
              check=True,
          )
          subprocess.run(
              [str(agent_coop), "--help"],
              cwd=clean_cwd,
              check=True,
              stdout=subprocess.DEVNULL,
          )

          sdist_environment = (
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "coop-sdist"
          )
          venv.EnvBuilder(with_pip=True, clear=True).create(sdist_environment)
          sdist_python = sdist_environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          sdist_coop = sdist_environment / (
              "Scripts/coop.exe" if os.name == "nt" else "bin/coop"
          )
          sdist_agent_coop = sdist_environment / (
              "Scripts/agent-coop.exe" if os.name == "nt"
              else "bin/agent-coop"
          )
          subprocess.run(
              [str(sdist_python), "-m", "pip", "install", "setuptools==82.0.1"],
              check=True,
          )
          subprocess.run(
              [str(sdist_python), "-m", "pip", "install", "--no-index",
               "--no-deps", "--no-build-isolation", str(sdists[0].resolve())],
              check=True,
          )
          sdist_cwd = pathlib.Path(os.environ["RUNNER_TEMP"]) / "coop-sdist-cwd"
          sdist_cwd.mkdir(exist_ok=True)
          subprocess.run(
              [str(sdist_coop), "smoke", "--offline"],
              cwd=sdist_cwd,
              check=True,
          )
          subprocess.run(
              [str(sdist_agent_coop), "--help"],
              cwd=sdist_cwd,
              check=True,
              stdout=subprocess.DEVNULL,
          )

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-coop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
